# Publica la web estática de dominicosweb/ en GitHub Pages.
# El tema y el plugin de WordPress no se publican: Pages no ejecuta PHP.
name: Publicar la web

on:
  push:
    branches: [main]
    paths:
      - 'dominicosweb/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cancelar la que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reunir los archivos que se publican
        run: |
          mkdir -p _site
          cp dominicosweb/index.html  _site/
          cp dominicosweb/styles.css  _site/
          cp dominicosweb/script.js   _site/
          cp dominicosweb/CNAME       _site/
          cp -r dominicosweb/images   _site/images

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: desplegar
        uses: actions/deploy-pages@v4
