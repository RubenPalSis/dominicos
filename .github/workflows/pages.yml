# Publica la web estática de dominicosweb/ en GitHub Pages.
#
# Antes de empaquetar se regeneran el listado de noticias, las páginas de cada
# noticia y el sitemap a partir de los JSON de dominicosweb/noticias/. Así,
# para publicar una noticia basta con subir su JSON: si se olvida ejecutar el
# script a mano, aquí se hace solo.
name: Publicar la web

on:
  push:
    branches: [main]
    paths:
      - 'dominicosweb/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cancelar la que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sin dependencias que instalar: el script es Node pelado. Si un JSON de
      # noticia está mal, falla aquí y no se publica nada roto.
      - name: Generar noticias y sitemap
        working-directory: dominicosweb
        run: node tools/generar-noticias.mjs

      - name: Reunir los archivos que se publican
        run: |
          mkdir -p _site/noticias
          cd dominicosweb
          cp index.html noticias.html 404.html           ../_site/
          cp styles.css script.js                        ../_site/
          cp robots.txt sitemap.xml manifest.webmanifest ../_site/
          cp CNAME                                       ../_site/
          cp -r images                                   ../_site/images
          # Solo las páginas generadas. Los .json son la fuente de la que
          # salen: publicarlos serviría el mismo texto en dos direcciones,
          # que es justo lo que no se quiere de cara a los buscadores.
          cp noticias/*.html                             ../_site/noticias/
          # Los README de las carpetas son para quien edita el repositorio,
          # no para la web.
          find ../_site -name 'README.md' -delete

      - name: Comprobar que está todo
        run: |
          for f in index.html noticias.html 404.html styles.css script.js \
                   robots.txt sitemap.xml manifest.webmanifest \
                   CNAME images/logo.jpg; do
            test -f "_site/$f" || { echo "FALTA _site/$f"; exit 1; }
          done
          # Nada de PHP ni de JSON de noticias en lo publicado.
          test -z "$(find _site -name '*.php')"          || { echo "Hay PHP publicado"; exit 1; }
          test -z "$(find _site/noticias -name '*.json')" || { echo "Hay JSON de noticias publicado"; exit 1; }
          # El panel de administración es una herramienta local y lleva la
          # contraseña dentro: si alguna vez acabara en _site, quedaría
          # publicada. Antes de que eso pase, se para la publicación.
          test -z "$(find _site -name 'admin.*')"        || { echo "El panel de administración NO debe publicarse"; exit 1; }
          grep -rql 'Ruben@2026' _site && { echo "Hay una contraseña en lo publicado"; exit 1; } || true
          # El listado tiene que llevar dentro las noticias, no un hueco.
          grep -q 'ncard__link' _site/noticias.html \
            || { echo "noticias.html no lleva el listado dentro"; exit 1; }
          echo "Páginas de noticias: $(ls _site/noticias/*.html | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: desplegar
        uses: actions/deploy-pages@v4
