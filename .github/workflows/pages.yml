# Publica la web estática de dominicosweb/ en GitHub Pages.
#
# Antes de empaquetar se genera el sitio entero —portada, listado de noticias,
# página de error, páginas sueltas, páginas de cada noticia, sitemap, robots,
# manifest y CNAME— a partir de los archivos de datos. Así, para cambiar algo
# de la web basta con subir su JSON: si se olvida ejecutar el script a mano,
# aquí se hace solo.
#
# Es también el camino por el que pasa todo lo que se guarda desde el panel
# de Pages CMS, que lo único que hace es escribir esos JSON.
name: Publicar la web

on:
  push:
    branches: [main]
    paths:
      - 'dominicosweb/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cancelar la que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Sin dependencias que instalar: el generador es Node pelado. Si un JSON
      # está mal, falla aquí y no se publica nada roto.
      - name: Generar la web
        working-directory: dominicosweb
        run: node tools/generar.mjs

      - name: Reunir los archivos que se publican
        run: |
          mkdir -p _site
          cp -r dominicosweb/. _site/

          # Lo que se queda fuera. Son las FUENTES de las que sale la web, no
          # la web: publicarlas serviría el mismo contenido en dos direcciones,
          # que es justo lo que no se quiere de cara a los buscadores.
          rm -rf _site/datos _site/paginas _site/tools
          rm -f  _site/noticias/*.json

          # Los README y la documentación son para quien edita el repositorio.
          find _site -name '*.md' -delete

      - name: Comprobar que está todo
        run: |
          EN_OBRAS=$(node -p "require('./dominicosweb/datos/mantenimiento.json').activo === true" 2>/dev/null || echo false)
          echo "Modo mantenimiento: $EN_OBRAS"

          # Esto tiene que estar siempre, se esté en obras o no.
          for f in index.html 404.html styles.css script.js \
                   robots.txt manifest.webmanifest CNAME images/logo.jpg; do
            test -f "_site/$f" || { echo "FALTA _site/$f"; exit 1; }
          done

          # Nada de PHP, ni de fuentes, ni de herramientas en lo publicado.
          for patron in '*.php' '*.mjs' '*.md'; do
            test -z "$(find _site -name "$patron")" || { echo "Hay $patron publicado"; exit 1; }
          done
          for dir in datos paginas tools; do
            test ! -d "_site/$dir" || { echo "Se publica _site/$dir y no debería"; exit 1; }
          done
          test -z "$(find _site -name '*.json' -path '*noticias*')" || { echo "Hay JSON de noticias publicado"; exit 1; }

          if [ "$EN_OBRAS" = "true" ]; then
            # En obras, la raíz es solo el cartel y la web vive bajo la carpeta
            # con clave. Que la portada pública NO lleve la web es justo lo que
            # se quiere comprobar: si se colara, el mantenimiento no serviría.
            grep -q 'content="noindex"' _site/index.html \
              || { echo "El cartel de mantenimiento debería llevar noindex"; exit 1; }
            ! grep -q 'id="contacto"' _site/index.html \
              || { echo "La portada pública lleva la web entera estando en obras"; exit 1; }
            test ! -f _site/noticias.html \
              || { echo "El listado sigue en la raíz estando en obras"; exit 1; }
            test -d _site/vista-previa \
              || { echo "FALTA la carpeta de vista previa"; exit 1; }
            grep -rq 'ncard__link' _site/vista-previa/*/noticias.html \
              || { echo "La vista previa no lleva el listado"; exit 1; }
            echo "Vista previa en: /$(cd _site && find vista-previa -mindepth 1 -maxdepth 1 -type d | head -1)/"
          else
            test -f _site/noticias.html || { echo "FALTA _site/noticias.html"; exit 1; }
            test -f _site/sitemap.xml  || { echo "FALTA _site/sitemap.xml"; exit 1; }
            test ! -d _site/vista-previa \
              || { echo "Se publica la vista previa fuera del modo obras"; exit 1; }
            # El listado tiene que llevar dentro las noticias, no un hueco, y la
            # portada tiene que llevar sus secciones: si el generador fallara en
            # silencio, saldrían páginas vacías con aspecto de estar bien.
            grep -q 'ncard__link' _site/noticias.html || { echo "noticias.html no lleva el listado dentro"; exit 1; }
            grep -q 'id="contacto"' _site/index.html  || { echo "index.html no lleva sus secciones"; exit 1; }
            echo "Páginas de noticias: $(ls _site/noticias/*.html | wc -l)"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: desplegar
        uses: actions/deploy-pages@v4
